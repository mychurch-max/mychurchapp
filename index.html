<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MY CHURCH - Bible Stories</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #151515;
}

button {
  border: none;
  border-radius: 7px;
  padding: 11px 15px;
  background: #d4af37;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.title {
  flex: 1;
  font-size: 17px;
  font-weight: bold;
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  position: relative;
  background: #111;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  position: absolute;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  z-index: 2;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px 10px;
}

button:disabled {
  opacity: 0.35;
  cursor: default;
}
</style>
</head>

<body>

<div class="header">

  <button onclick="goBack()">← Back</button>

  <div class="title" id="title">
    Bible Story
  </div>

</div>

<div class="player">

  <div id="loading">Loading Bible story...</div>

  <iframe
    id="youtube"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

</div>

<div class="controls">

  <button id="previous" onclick="navigate('prev')">
    ⏮ Previous
  </button>

  <button onclick="retryVideo()">
    ↻ Retry
  </button>

  <button onclick="exitFullscreen()">
    Exit Fullscreen
  </button>

  <button id="next" onclick="navigate('next')">
    Next ⏭
  </button>

</div>

<script>

const params = new URLSearchParams(location.search);

let videoId = params.get('v') || '';

let videoTitle = params.get('title') || 'Bible Story';

let previousId = params.get('prev') || '';
let previousTitle = params.get('prevTitle') || '';

let nextId = params.get('next') || '';
let nextTitle = params.get('nextTitle') || '';

const iframe = document.getElementById('youtube');
const loading = document.getElementById('loading');

function updateInterface() {

  document.getElementById('title').textContent = videoTitle;

  document.getElementById('previous').disabled = !previousId;
  document.getElementById('next').disabled = !nextId;

}

function loadVideo() {

  if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
    loading.textContent = 'Invalid video ID.';
    return;
  }

  loading.style.display = 'flex';
  loading.textContent = 'Loading Bible story...';

  iframe.src =
    'https://www.youtube-nocookie.com/embed/' +
    encodeURIComponent(videoId) +
    '?playsinline=1&rel=0';

}

iframe.addEventListener('load', () => {
  loading.style.display = 'none';
});

function goBack() {
  location.href = 'mychurch://back';
}

function retryVideo() {

  loading.style.display = 'flex';
  iframe.src = 'about:blank';

  setTimeout(loadVideo, 300);

}

function exitFullscreen() {

  if (document.fullscreenElement) {
    document.exitFullscreen();
  }

}

function goBack() {

  location.href = 'mychurch://back';

}

updateInterface();
loadVideo();

</script>

</body>
</html>
