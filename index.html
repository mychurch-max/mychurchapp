<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MY CHURCH - Bible Stories</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

/* TOP HEADER */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 62px;
  padding: 10px 12px;
  background: #151515;
  border-bottom: 1px solid #444;
}

button {
  border: none;
  border-radius: 7px;
  padding: 12px 15px;
  background: #d4af37;
  color: #000;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  min-height: 42px;
}

button:active {
  opacity: 0.7;
}

button:disabled {
  opacity: 0.35;
  cursor: default;
}

.back-button {
  flex-shrink: 0;
  font-size: 15px;
}

.title {
  flex: 1;
  min-width: 0;
  font-size: 17px;
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* VIDEO PLAYER */
.player {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  position: relative;
  background: #111;
  z-index: 1;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  position: absolute;
  inset: 0;
  z-index: 1;
}

#loading {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  color: white;
  font-size: 16px;
  z-index: 2;
}

/* VIDEO TITLE */
.video-heading {
  padding: 16px 12px;
  text-align: center;
  color: #d4af37;
  font-size: 19px;
  font-weight: bold;
}

/* PLAYER CONTROLS */
.controls {
  position: sticky;
  bottom: 0;
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 14px 10px;
  background: #151515;
  border-top: 1px solid #444;
}

@media (max-width: 480px) {
  .controls {
    gap: 7px;
  }

  .controls button {
    padding: 10px;
    font-size: 12px;
  }

  .title {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<!-- BACK BUTTON AND TITLE -->
<div class="header">

  <button class="back-button" onclick="goBack()">
    ← Back
  </button>

  <div class="title" id="title">
    Bible Story
  </div>

</div>

<!-- YOUTUBE VIDEO -->
<div class="player">

  <div id="loading">
    Loading Bible story...
  </div>

  <iframe
    id="youtube"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

</div>

<!-- VIDEO TITLE -->
<div class="video-heading" id="videoHeading">
  Bible Story
</div>

<!-- PLAYER CONTROLS -->
<div class="controls">

  <button id="previous" onclick="navigate('prev')">
    ⏮ Previous
  </button>

  <button onclick="retryVideo()">
    ↻ Retry
  </button>

  <button onclick="exitFullscreen()">
    ⛶ Exit Fullscreen
  </button>

  <button id="next" onclick="navigate('next')">
    Next ⏭
  </button>

</div>

<script>

const params = new URLSearchParams(location.search);

let videoId = params.get('v') || '';

let videoTitle = params.get('title') || 'Bible Story';

let previousId = params.get('prev') || '';
let previousTitle = params.get('prevTitle') || '';

let nextId = params.get('next') || '';
let nextTitle = params.get('nextTitle') || '';

const iframe = document.getElementById('youtube');
const loading = document.getElementById('loading');

function updateInterface() {

  document.getElementById('title').textContent = videoTitle;

  document.getElementById('videoHeading').textContent = videoTitle;

  document.getElementById('previous').disabled = !previousId;

  document.getElementById('next').disabled = !nextId;

}

function loadVideo() {

  if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {

    loading.textContent = 'Invalid video ID.';

    return;

  }

  loading.style.display = 'flex';

  loading.textContent = 'Loading Bible story...';

  iframe.src =
    'https://www.youtube-nocookie.com/embed/' +
    encodeURIComponent(videoId) +
    '?playsinline=1&rel=0';

}

iframe.addEventListener('load', () => {

  loading.style.display = 'none';

});

// BACK TO FLUTTER
function goBack() {

  location.href = 'mychurch://back';

}

// PREVIOUS AND NEXT
function navigate(direction) {

  if (direction === 'next' && nextId) {

    location.href = 'mychurch://next';

  }

  if (direction === 'prev' && previousId) {

    location.href = 'mychurch://previous';

  }

}

// RELOAD CURRENT VIDEO
function retryVideo() {

  loading.style.display = 'flex';

  loading.textContent = 'Reloading video...';

  iframe.src = 'about:blank';

  setTimeout(loadVideo, 300);

}

// EXIT FULLSCREEN
function exitFullscreen() {

  if (document.fullscreenElement) {

    document.exitFullscreen();

  }

}

updateInterface();

loadVideo();

</script>

</body>
</html>
